name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.82.0
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.46.0"

      - name: Install Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: "0.15.0"
          cache-dependency-path: package/lib.typ

      - name: Install document verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes imagemagick librsvg2-bin poppler-utils qpdf

      - name: Install wasm-tools
        run: cargo install wasm-tools --version 1.245.1 --locked

      - name: Run release checks
        run: just release-check

  typst-package:
    name: Build Typst package archive
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          package_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' package/typst.toml | head -n 1)"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)"
          tag_version="${GITHUB_REF_NAME#v}"

          if [[ -z "$package_version" || -z "$cargo_version" ]]; then
            echo "Could not determine package versions." >&2
            exit 1
          fi

          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag version $tag_version does not match package/typst.toml version $package_version." >&2
            exit 1
          fi

          if [[ "$cargo_version" != "$package_version" ]]; then
            echo "Cargo version $cargo_version does not match Typst package version $package_version." >&2
            exit 1
          fi

          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Build package archive
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          mkdir -p release-assets typst-dist/ribon
          cp -a package/. typst-dist/ribon/
          cd typst-dist
          zip -9 -r "../release-assets/ribon-typst-${VERSION}.zip" ribon

      - name: Upload package archive
        uses: actions/upload-artifact@v7
        with:
          name: typst-package
          path: release-assets/*
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    needs: typst-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  deploy-docs:
    name: Deploy documentation
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel configuration
        run: vercel pull --yes --environment production --token "$VERCEL_TOKEN"

      - name: Build documentation
        run: vercel build --prod --token "$VERCEL_TOKEN"

      - name: Deploy documentation
        run: vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
