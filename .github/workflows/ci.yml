name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Release validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.82
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.46.0"
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.0
          cache-dependency-path: package/lib.typ
      - name: Install PDF/vector QA tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils imagemagick librsvg2-bin qpdf
      - name: Install pinned WebAssembly validator
        run: cargo install wasm-tools --version 1.245.1 --locked
      - name: Source formatting, Rust tests, and lints
        run: just markdown-test fmt-test test
      - name: Typst/WASM and license boundary
        run: just wasm-sync-test wasm-test license-test typst-test
      - name: Advanced numerical and performance gates
        run: just pseudoknot-test conditional-density2-test conditional-density2-performance-test exact-feature-test performance-test
      - name: Real-data native-vector rendering QA
        run: just render-test
